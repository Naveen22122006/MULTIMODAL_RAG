[project]
name = "multimodelrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveen22122006", email = "naveenmanuka710@email.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "groq>=0.37.1",
    "huggingface-hub>=1.33.0",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pinecone>=7.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tabulate>=0.10.0",
    "transformers>=5.18.0",
]

[project.scripts]
multimodelrag = "multimodelrag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
